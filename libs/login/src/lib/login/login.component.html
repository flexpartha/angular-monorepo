<mat-card style="width: 364px">
  <mat-card-title style="text-align: center; padding: 0 2%"
    >Login</mat-card-title
  >
  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div style="display: flex; flex-direction: column">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput type="text" formControlName="username" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>
        <button type="submit" mat-raised-button>login</button>
      </div>
    </form>
  </mat-card-content>
  <div
    style="
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      flex-direction: row;
    "
  >
    <mat-card-actions>
      <button type="button" mat-raised-button (click)="showSuccess()">
        Show Success
      </button>
    </mat-card-actions>
    <mat-card-actions>
      <button type="button" mat-raised-button (click)="showError()">
        Show Error
      </button>
    </mat-card-actions>
    <mat-card-actions>
      <button type="button" mat-raised-button (click)="showWarning()">
        Show Warning
      </button>
    </mat-card-actions>
  </div>
</mat-card>
